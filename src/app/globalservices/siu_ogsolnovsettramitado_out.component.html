<form novalidate>
    <h2 class="title">{{title}}</h2>
    <div class="siuRegion" [ngClass]="cssClasses">
        <imes-input-numeric [field]="oaNumProcesados" *ngIf="oaNumProcesados.visible"></imes-input-numeric>
        <imes-input-numeric [field]="oaNumErrores" *ngIf="oaNumErrores.visible"></imes-input-numeric>
        <imes-input-string [field]="oaErrores" *ngIf="oaErrores.visible"></imes-input-string>
    </div>
    <div class="col-12 iiuButtons">
        <button type="button" class="btn btn-danger" (click)="processCancel()">{{langMng.translateText('app_CLOSE', '')}}</button>
    </div>
</form>
