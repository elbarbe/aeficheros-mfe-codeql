apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: aeficheros-mfe
  labels:
    app: aeficheros-mfe
    app.kubernetes.io/component: aeficheros-mfe
    app.kubernetes.io/instance: aeficheros-mfe
    app.kubernetes.io/name: aeficheros-mfe
    app.kubernetes.io/part-of: ae-app-frontend
    app.openshift.io/runtime: aeficheros-mfe
spec:
  source:
    type: Git
    git:
#INIGIT
      uri: "git@github.com:IntegranovaSoporteColSanitas/aeficheros-mfe.git"
      ref: "publish"
    sourceSecret:
      name: ae-git-credentials
#FINGIT
  strategy:
    type: Docker
  output:
    to:
      kind: ImageStreamTag
      name: aeficheros-mfe:latest
